<body>
<div class="calculadora">

    <div class="borda_exterior">

        <div class="borda_interior">

            
                <input id="texto" readonly>
                <!--O readonly faz com que não dê pra digitar no input-->
                <!--input é um elemento HTML que permite inserir texto dentro dele para fins futuros, como enviar seu nome para o site e ele retornar "Olá {nome}"-->
            

                <div class="botoes">
                    <div class="digitos">
                    <!--Um id ou class se torna uma função a partir do momento onde é acrescentado o "()"-->
                    <!--Dá pra fazer o botão reagir após um clique, com o comando: "onclick" após "button"-->
                    <button onclick="appendToDisplay('1')">1</button>
                    <button onclick="appendToDisplay('2')">2</button>
                    <button onclick="appendToDisplay('3')">3</button>
                    <button onclick="appendToDisplay('4')">4</button>
                    <button onclick="appendToDisplay('5')">5</button>
                    <button onclick="appendToDisplay('6')">6</button>
                    <button onclick="appendToDisplay('7')">7</button>
                    <button onclick="appendToDisplay('8')">8</button>
                    <button onclick="appendToDisplay('9')">9</button>
                    <button onclick="appendToDisplay('0')">0</button>
                    <button onclick="appendToDisplay('00')">00</button>
                    
                    </div>
                   <div class="oper_res"> <!--Por que colocar a div dos operadores e  a do resultado em uma mesma div já fez eles estarem na mesma coluna? Talvez por que eles se tornaram todos um só conjunto? E agora o "=" não está separado dos outros elementos, mas sendo considerado parte dele-->
                        <div class="operadores">
                        <button onclick="appendToDisplay('+')">+</button>
                        <button onclick="appendToDisplay('-')">-</button>
                        <button onclick="appendToDisplay('*')">x</button>
                        <button onclick="appendToDisplay('/')">/</button>
                    
                    </div>
                    <div class="resultado">
                        <button onclick="calcular()">=</p>
                    </div>
                </div>
            </div>

        </div>

    </div>

</div>
